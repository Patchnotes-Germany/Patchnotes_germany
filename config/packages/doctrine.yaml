doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Pinned so that the platform is known without querying the server (SPEC.md § 2: MySQL 8.4 LTS).
        server_version: '8.4'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            # Text is compared case-insensitively; keys, slugs and hashes get binary collations
            # on the column level (SPEC.md § 17).
            collation: utf8mb4_0900_ai_ci
        profiling_collect_backtrace: '%kernel.debug%'

    orm:
        auto_mapping: true
        # PHP 8.4 native lazy objects instead of generated proxy classes.
        enable_native_lazy_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        validate_xml_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "patchnotes_test" (see docker/mysql/init); TEST_TOKEN separates parallel test processes.
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
