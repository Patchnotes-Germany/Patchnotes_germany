# The shared vocabulary of Patchnotes (SPEC.md § 9.1).
#
# One dictionary serves two purposes: it is what a person picks in the onboarding questionnaire, and
# it is the only set of tags the AI may use to describe who a change concerns. That is why a tag the
# AI would like to invent goes to `suggested_tags` instead — a vocabulary both sides share is what
# makes the matching of § 9.2 deterministic and explainable ("you see this because you said: Berlin,
# child under 3").
#
# This file is copied into the `content` repository at bootstrap and is edited there by pull
# request. Names are given in the master language only; the other languages of
# `patchnotes.languages` are added by native speakers, because a wrong label here sends the wrong
# alerts to the wrong people.
#
# `exclusive: true` marks a group where exactly one answer is possible.

groups:
  residence:
    exclusive: true
    names:
      en: Residence status
    tags:
      german_citizen:
        names: { en: German citizen }
      eu_citizen:
