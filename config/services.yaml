# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    default_worker_heartbeat_file: '/tmp/messenger-worker.heartbeat'

services:
    _instanceof:
        # One implementation per forge; the locator picks by configuration (SPEC.md § 3.1).
        App\Git\Forge\ForgeClientInterface:
            tags: ['app.forge_client']
        # Initial structure of the laws and content repositories.
        App\Git\Bootstrap\RepositoryLayout:
            tags: ['app.repository_layout']
        # Every data source, so it can be registered and monitored (SPEC.md § 6.1).
        App\Source\Adapter\SourceAdapterInterface:
            tags: ['app.source_adapter']

    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Infrastructure values that several services need; domain configuration comes from
            # config/packages/patchnotes.yaml (M1).
            string $meiliUrl: '%env(MEILI_URL)%'
            string $meiliMasterKey: '%env(default::MEILI_MASTER_KEY)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Core/PatchnotesBundle.php'
            - '../src/**/Entity/'
            - '../src/**/Enum/'
            - '../src/**/Exception/'
            - '../src/**/Message/'
            - '../src/**/Value/'
            - '../src/Git/Webhook/WebhookEvent.php'
            # Built per repository by the RepositoryRegistry, not by the container.
            - '../src/Git/GitRepository.php'
            - '../src/Git/RepositoryReader.php'
            - '../src/Git/RepositoryConfig.php'
            - '../src/Git/Worktree.php'
            # Built per provider by the LlmClientFactory from patchnotes.ai.providers (SPEC.md § 8.1);
            # the factory and the registry next to them are ordinary services.
            - '../src/Ai/Client/OpenAiStyleClient.php'
            - '../src/Ai/Client/OpenAiClient.php'
            - '../src/Ai/Client/OpenAiCompatibleClient.php'
            - '../src/Ai/Client/AnthropicClient.php'
            - '../src/Ai/Client/FakeLlmClient.php'
            - '../src/Ai/Prompt/RenderedPrompt.php'
            - '../src/Ai/Routing/TaskRoute.php'

    # Typed access to the whole "patchnotes" configuration tree. Public, because commands, tests and
    # the admin read it directly from the container (SPEC.md § 24.19).
    App\Core\Config\PatchnotesConfig:
        arguments:
            $config: '%patchnotes.config%'
        public: true

    # Entry points of the AI layer. Public because the tests and `make demo` replace a provider with
    # the scripted one (LlmClientRegistry::override) and because nothing depends on the gateway until
    # the pipeline of M5 does — an unused private service would be removed from the container.
    App\Ai\AiGateway:
        public: true

    App\Ai\Client\LlmClientRegistry:
        public: true

    # The federal synchronisation is wired to the gesetze-im-internet adapter; the service itself
    # only knows the interface, which is what lets the integration tests drive it from fixtures.
    App\Laws\Sync\BundLawSynchroniser:
        arguments:
            $adapter: '@App\Source\Adapter\Bund\GiiSourceAdapter'
            $repealConfirmations: '%patchnotes.sources.repeal_confirmations%'

    # The first import of a jurisdiction reads from the same adapter (SPEC.md § 4.7).
    App\Laws\Sync\BaselineImporter:
        arguments:
            $adapter: '@App\Source\Adapter\Bund\GiiSourceAdapter'

    # Touches the heartbeat file that the Docker healthcheck of every worker container reads
    # (frankenphp/worker-healthcheck.sh, ADR 0003).
    App\Core\Messenger\WorkerHeartbeatSubscriber:
        arguments:
            $heartbeatFile: '%env(default:default_worker_heartbeat_file:WORKER_HEARTBEAT_FILE)%'
            $intervalSeconds: 10
