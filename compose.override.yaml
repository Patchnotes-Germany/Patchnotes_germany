# Development environment override (applied automatically by "docker compose").

x-app-dev: &app-dev
  image: ${IMAGES_PREFIX:-}patchnotes-php-dev
  build:
    context: .
    target: frankenphp_dev
  volumes:
    - ./:/app
    # Keep var/ off the bind-mount for faster I/O on Mac/Windows.
    - /app/var
    - repos:/app/var/repos
    - storage:/app/var/storage
  environment:
    XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    APP_ENV: "${APP_ENV:-dev}"
  tty: true

services:
  php:
    <<: *app-dev
    volumes:
      - ./:/app
      - /app/var
      - repos:/app/var/repos
      - storage:/app/var/storage
      - caddy_data:/data
      - caddy_config:/config
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    environment:
      APP_PRIMARY: "1"
      CADDY_SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: demo
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"

  worker-sources:
    <<: *app-dev
  worker-pipeline:
    <<: *app-dev
  worker-git:
    <<: *app-dev
  worker-ai:
    <<: *app-dev
  worker-notify:
    <<: *app-dev
  scheduler:
    <<: *app-dev

  mysql:
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

  meilisearch:
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

